name: dentist-clinic

services:
  db:
    image: postgres:18
    container_name: clinic-db
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_dev
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - clinic_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clinic_pgdata: